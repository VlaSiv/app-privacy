    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.55;
      }

      body {
        margin: 0;
        background: #f6f7f8;
        color: #16191d;
      }

      main {
        box-sizing: border-box;
        max-width: 760px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 48px 24px 64px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 16px;

      }

      li {
        margin: 10px 0;
        font-size: 16px;
      }

      a {

      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111417;
          color: #eef2f5;
        }

        main {

        }

        a {

      <ul>
